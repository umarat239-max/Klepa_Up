services:
  - type: web
    name: klepa-up
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - {key: BOT_TOKEN, sync: false}
      - {key: OPENROUTER_KEY, sync: false}
      - {key: PUBLIC_URL, sync: false}
      - {key: BOT_USERNAME, sync: false}
      - {key: ADMIN_IDS, value: "1424001997"}
      - {key: CHANNEL, value: "@KlepaUp"}
      - {key: DATABASE_URL, fromDatabase: {name: klepa-db, property: connectionString}}
databases:
  - name: klepa-db
    plan: free
